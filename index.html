async function checkout(m){const{data:st}=await sb.from('stores').select('*').eq('slug',m[1]).maybeSingle();if(!st)throw new Error('Store not found');const cart=carts[st.id];

function initMap(){if(cmap){setTimeout(()=>cmap.invalidateSize(),60);return}const hasS=st.latitude!=null,c=hasS?[+st.latitude,+st.longitude]:NG;cmap=newMap('cmap',c,hasS?13:12);
  if(hasS){L.marker(c,{icon:pin('🏪')}).addTo(cmap).bindPopup(esc(st.name));(zones||[]).filter(z=>z.radius_km).forEach(z=>L.circle(c,{radius:z.radius_km*1000,weight:1.5,fillOpacity:.04,color:'#15966B'}).addTo(cmap).bindTooltip(z.name+' · '+money(z.fee)))}

 const[{data:i,error},{data:t}]=await Promise.all([sb.rpc('get_order_payment_instructions',{p_reference:ref,p_phone:phone}),sb.rpc('track_order',{p_reference:ref,p_phone:phone})]);if(error)throw error;
 const o=t.order,addr=o.delivery_address;const msg=`Hello ${i.store_name}, this is ${S.profile?.full_name||'a customer'} (order ${ref}).\n${t.items.map(x=>`• ${x.name}${x.variant?' ('+x.variant+')':''} × ${x.quantity}`).join('\n')}\nTotal: ${money(i.total)}\nPayment: Bank transfer — ${i.payment_status==='submitted'?'receipt uploaded, awaiting your confirmation':'transfer made / about to be made'}\n${o.fulfilment==='delivery'&&addr?'Delivery to: '+[addr.street,addr.landmark,addr.area,addr.city].filter(Boolean).join(', '):'Pickup'}`;

 app.innerHTML=`<h2>Order ${esc(ref)}</h2><div class="card"><div class="row sp"><span>Status</span>${badge(i.status)}</div><div class="row sp"><b>Total payable</b><b style="font-size:1.4rem;color:var(--head)">${money(i.total)}</b></div></div>

async function track(m,q){const mine=JSON.parse(localStorage.vorders||'[]');const ref=q.get('ref');
 if(!ref){app.innerHTML=`<h2>Track your order</h2><form class="card" data-submit="go"><label>Order reference</label><input name="ref" required placeholder="VND-XXXXXXXX"><label>Phone number used on the order</label><input name="p" type="tel" ${S.user?'':'required'}><button class="btn" style="margin-top:12px">Track</button></form>${mine.length?`<h3>Recent orders on this device</h3>${mine.map(o=>`<a class="card" style="display:block" href="#/track?ref=${esc(o.ref)}">${esc(o.ref)} · ${esc(o.store)}</a>`).join('')}`:''}`;
  ACT.go=f=>{const v=fd(f);sessionStorage['ph_'+v.ref.toUpperCase().trim()]=v.p;location.hash='#/track?ref='+encodeURIComponent(v.ref.trim())};return}
 const R_=ref.toUpperCase(),phone=sessionStorage['ph_'+R_]||(mine.find(o=>o.ref===R_)||{}).phone||null;
 const load=async()=>{const{data:t,error}=await sb.rpc('track_order',{p_reference:R_,p_phone:phone});if(error)throw error;const o=t.order,idx=STEPS.indexOf(o.status==='payment_submitted'?'awaiting_payment':o.status);
  const done=s=>o.status==='cancelled'||o.status==='refunded'?false:STEPS.indexOf(s)<=idx;
  const steps=o.fulfilment==='pickup'?['awaiting_payment','payment_confirmed','accepted','preparing','ready_for_pickup','delivered']:STEPS;
  const doneP=s=>{const order=o.fulfilment==='pickup'?steps:STEPS;const cur=order.indexOf(o.status==='payment_submitted'?'awaiting_payment':o.status);return !['cancelled','refunded'].includes(o.status)&&order.indexOf(s)<=cur};

  app.innerHTML=`<h2>Order ${esc(o.reference)}</h2><div class="card"><div class="row sp"><b>${esc(t.store.name)}</b>${badge(o.status)}</div><div class="mut">Placed ${dt(o.created_at)} · Last update ${dt(o.updated_at)}</div>${etaText(t)?`<div>⏱ ${etaText(t)}</div>`:''}
  <ul class="tl" style="margin-top:10px">${steps.map(s=>`<li class="${doneP(s)?'done':''}">${esc(s==='awaiting_payment'?'Order placed':LBL[s])}</li>`).join('')}</ul>${['cancelled','refunded'].includes(o.status)?`<p>${badge(o.status)}</p>`:''}
  ${o.payment_status==='submitted'?'<p class="mut">Payment submitted — waiting for the vendor to verify.</p>':o.payment_status==='rejected'?'<p class="badge b">The vendor could not verify your payment. Please check the details or contact them.</p>':''}</div>
  <div class="card"><h3>Items</h3>${t.items.map(i=>`<div class="row sp"><span>${esc(i.name)}${i.variant?' ('+esc(i.variant)+')':''} × ${i.quantity}</span><span>${money(i.line_total)}</span></div>`).join('')}<hr style="border-color:var(--line)"><div class="row sp"><span>Delivery</span><span>${money(o.delivery_fee)}</span></div><div class="row sp"><b>Total</b><b>${money(o.total)}</b></div></div>
  ${t.rider?`<div class="card"><h3>Your rider</h3><p><b>${esc(t.rider.name)}</b> ${t.rider.vehicle?'· '+esc(t.rider.vehicle):''}${t.rider.dispatch_reference?`<br><span class="mut">Dispatch ref: ${esc(t.rider.dispatch_reference)}</span>`:''}${t.rider.eta?`<br>Estimated arrival: ${dt(t.rider.eta)}`:''}</p><div class="row"><a class="btn" href="tel:${esc(t.rider.phone)}">📞 Call</a><a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/${waNum(t.rider.phone)}">💬 WhatsApp</a></div><p class="mut">Live map tracking appears only when real GPS sharing is enabled. None is simulated.</p></div>`:''}
  ${o.delivery_address?.lat?'<div class="card"><h3>Delivery destination</h3><div id="tmap" class="map"></div></div>':''}
  <div class="row">${canC?'<button class="btn" data-act="confirm">✅ Confirm delivery</button>':''}${o.delivery_confirmed_at?`<span class="badge">Delivery confirmed ${dt(o.delivery_confirmed_at)}</span>`:''}${!['delivered','cancelled','refunded'].includes(o.status)?`<a class="btn sec" href="#/play?ref=${esc(o.reference)}">🎮 Play while you wait</a>`:''}${o.status!=='cancelled'?'<button class="btn sec" data-act="problem">⚠️ Report a problem</button>':''}${o.status==='delivered'&&S.user?'<button class="btn sec" data-act="review">⭐ Leave a review</button>':''}</div>`;
  clearMaps();if(o.delivery_address?.lat){const dp=[+o.delivery_address.lat,+o.delivery_address.lng],mp=newMap('tmap',dp,15);L.marker(dp,{icon:pin('🏠')}).addTo(mp).bindPopup('Delivery address');sb.from('stores').select('latitude,longitude,name').eq('slug',t.store.slug).maybeSingle().then(({data:sp})=>{if(sp?.latitude){const q=[+sp.latitude,+sp.longitude];L.marker(q,{icon:pin('🏪')}).addTo(mp).bindPopup(esc(sp.name));L.polyline([q,dp],{dashArray:'6 8',weight:2}).addTo(mp);mp.fitBounds([q,dp],{padding:[40,40]})}})}
  ACT.confirm=async()=>{const{error}=await sb.rpc('confirm_delivery',{p_reference:R_,p_phone:phone});if(error)throw error;toast('Thanks! Delivery confirmed.');load()};
  ACT.problem=async()=>{const r=await ask('Report a problem',[{n:'r',l:'What went wrong?',r:1},{n:'d',l:'Details',t:'textarea'}],'Send');if(!r)return;const{error}=await sb.rpc('report_problem',{p_reference:R_,p_phone:phone,p_reason:r.r,p_details:r.d});if(error)throw error;toast('Reported to the vendor')};

/* ---------- vendor onboarding ---------- */
async function join(m,q){const code=q.get('code')||sessionStorage.invite||'';if(code)sessionStorage.invite=code;

 const V=S.vendor,ST=S.store,tab=q.get('t')||'overview',T=[['overview','Overview'],['orders','Orders'],['products','Products'],['store','Store'],['reviews','Reviews'],['map','Map & zones'],['pay','Payments & riders']];

async function play(m,q){const g=q.get('g'),ref=q.get('ref')||(g?null:(JSON.parse(localStorage.vorders||'[]')[0]||{}).ref);
 app.innerHTML=`<div id="obar"></div><div id="pg"></div>`;
 if(ref){let last=null;const phone=phoneFor(ref);const tick=async()=>{const{data:t,error}=await sb.rpc('track_order',{p_reference:ref,p_phone:phone});const bar=$('#obar');if(error||!bar){if(bar)bar.innerHTML='';return}const o=t.order;if(last&&last!==o.status)toast('📦 Order update: '+(LBL[o.status]||o.status));last=o.status;const e=etaText(t);bar.innerHTML=`<a class="card row sp" style="color:inherit;padding:10px 14px;border-left:4px solid var(--pri)" href="#/track?ref=${esc(ref)}"><span>📦 <b>${esc(ref)}</b> · ${esc(t.store.name)}</span><span>${badge(o.status)} ${e?`<span class="mut">${e}</span>`:''}</span></a>`};
  await tick();S.timer=setInterval(()=>run(tick),20000)}
 if(!g){const b=JSON.parse(localStorage.vbadges||'{}');$('#pg').innerHTML=`<div class="hero"><h1>VENDORA Play 🎮</h1><p>Quick games while you wait. Earn badges and climb the leaderboards. Just for fun: no money, no prizes, no gambling.</p>${Object.keys(b).length?`<div class="row">${Object.entries(b).map(([k,v])=>`<span class="wchip">${BADGE[v]} ${esc((GAMES.find(x=>x[0]===k)||[])[2]||k)}</span>`).join('')}</div>`:'<p style="margin:0;opacity:.85">Score 100 for Bronze, 500 for Silver, 1000 for Gold.</p>'}</div><div class="grid">${GAMES.map(x=>`<a class="card" style="color:inherit;text-align:center" href="#/play?g=${x[0]}${ref?'&ref='+esc(ref):''}"><div class="gicon">${x[1]}</div><b style="color:var(--head)">${x[2]}</b><div class="mut">${x[3]}</div></a>`).join('')}</div>${ref?`<p><a class="btn" href="#/track?ref=${esc(ref)}">← Back to my order</a></p>`:''}`;return}
 const G=GAMES.find(x=>x[0]===g);if(!G){location.hash='#/play';return}
 $('#pg').innerHTML=`<div class="row sp"><h2>${G[1]} ${G[2]}</h2><div class="row"><a class="btn sec sm" href="#/play${ref?'?ref='+esc(ref):''}">All games</a>${ref?`<a class="btn sm" href="#/track?ref=${esc(ref)}">← Back to my order</a>`:''}</div></div><div id="ga"></div><div class="card"><h3>🏆 Leaderboard</h3><div id="lb" class="mut">Loading…</div></div>`;
 ACT.again=()=>route();loadLB(g);
 const done=sc=>finish(g,sc);
 ({'word-puzzle':gWord,'number-challenge':gNum,'memory-match':gMem,'trivia':gTrivia,'brain-teaser':gBrain,'spin-reveal':gSpin})[g](done)}

async function loadLB(slug){const{data}=await sb.rpc('get_leaderboard',{p_slug:slug,p_limit:10});const el=$('#lb');if(!el)return;el.innerHTML=data?.length?`<ol style="margin:0;padding-left:20px">${data.map(r=>`<li style="color:var(--ink)"><b>${esc(r.nickname)}</b> · ${r.score} ${r.badge?BADGE[r.badge]:''}</li>`).join('')}</ol>`:'No scores yet. Be the first!'}
async function finish(slug,score){score=Math.round(score);let nick=localStorage.vnick||(S.profile?.full_name||'').split(' ')[0];
 if(score>0&&!nick){const r=await ask('Your player name',[{n:'n',l:'Nickname (shown on the leaderboard)',r:1,a:'maxlength="24"'}],'Save');nick=r?.n}
 let msg='Keep playing to earn Bronze (100), Silver (500) and Gold (1000) badges.';
 if(score>0&&nick){localStorage.vnick=nick;const{data,error}=await sb.rpc('submit_game_score',{p_slug:slug,p_score:score,p_nickname:nick});if(error)toast(error.message,true);else if(data?.badge){const b=JSON.parse(localStorage.vbadges||'{}'),rk={Bronze:1,Silver:2,Gold:3};if(!b[slug]||rk[data.badge]>rk[b[slug]])b[slug]=data.badge;localStorage.vbadges=JSON.stringify(b);msg=`${BADGE[data.badge]} You earned a ${data.badge} badge!`}}
 const ga=$('#ga');if(!ga)return;ga.innerHTML=`<div class="card empty"><h1>${score} points</h1><p>${msg}</p>${slug==='brain-teaser'?'<p class="mut">A new teaser arrives tomorrow.</p>':'<button class="btn" data-act="again">Play again</button>'}</div>`;loadLB(slug)}

function gWord(done){const ws=pick(WORDS,5);let i=0,pts=0,t0=0,hint=0;
 const next=()=>{if(i>=5)return done(pts);const w=ws[i];let sc;do{sc=[...w].sort(()=>Math.random()-.5).join('')}while(sc===w);t0=Date.now();hint=0;$('#ga').innerHTML=`<div class="card empty"><div class="mut">Word ${i+1} of 5 · ${pts} pts</div><h1 style="letter-spacing:.3em">${sc}</h1><form data-submit="wg" class="row" style="justify-content:center"><input id="wi" style="max-width:220px;text-transform:uppercase" autocomplete="off"><button class="btn">Check</button></form><div class="row" style="justify-content:center;margin-top:10px"><button class="btn sec sm" data-act="wh">💡 Hint (−30)</button><button class="btn sec sm" data-act="ws">Skip</button></div><p class="mut" id="wm"></p></div>`;$('#wi').focus()};
 ACT.wg=f=>{const g=f.querySelector('#wi').value.trim().toUpperCase();if(g===ws[i]){pts+=Math.max(40,Math.round(200-(Date.now()-t0)/1000*3-hint*30));i++;next()}else{$('#wm').textContent='Not quite, try again!';f.reset()}};
 ACT.wh=()=>{hint++;$('#wm').textContent='Starts with: '+ws[i].slice(0,Math.min(hint+1,ws[i].length-1))};ACT.ws=()=>{i++;next()};next()}

function gNum(done){let sc=0,streak=0,left=60,ans=0;
 const q=()=>{const op=['+','−','×'][Math.floor(Math.random()*3)],r=n=>Math.floor(Math.random()*n);let a,b;if(op==='×'){a=2+r(11);b=2+r(11);ans=a*b}else if(op==='+'){a=10+r(90);b=10+r(90);ans=a+b}else{a=20+r(80);b=1+r(a);ans=a-b}
  $('#ga').innerHTML=`<div class="card empty"><div class="row sp"><b id="nt">⏱ ${left}s</b><b>${sc} pts</b></div><h1>${a} ${op} ${b} = ?</h1><form data-submit="ng" class="row" style="justify-content:center"><input id="ni" type="number" inputmode="numeric" style="max-width:160px"><button class="btn">OK</button></form><p class="mut">Streak: ${streak}</p></div>`;$('#ni').focus()};
 S.gameIv=setInterval(()=>{left--;const e=$('#nt');if(!e){clearInterval(S.gameIv);return}e.textContent='⏱ '+left+'s';if(left<=0){clearInterval(S.gameIv);done(sc)}},1000);
 ACT.ng=f=>{const v=+f.querySelector('#ni').value;if(v===ans){streak++;sc+=25+Math.min(streak,10)*3}else streak=0;q()};q()}

function gMem(done){const E=pick(['store','bag','phone2','starfill','package','card','pin','bell','palette','gamepad','compass','home'],8),deck=pick([...E,...E],16);let open=[],lock=false,moves=0,found=0,t0=0;
 $('#ga').innerHTML=`<div class="card"><div class="row sp"><b id="mm">Moves: 0</b><span class="mut">Match all 8 pairs</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px">${deck.map((e,i)=>`<button class="chip mc" data-act="mf" data-i="${i}" style="aspect-ratio:1;font-size:1.7rem;padding:0;justify-content:center" aria-label="Hidden card">${ic('help','muted')}</button>`).join('')}</div></div>`;
 ACT.mf=el=>{if(lock)return;const i=+el.dataset.i;if(el.dataset.f||open.includes(i))return;if(!t0)t0=Date.now();el.innerHTML=ic(deck[i]);open.push(i);
  if(open.length===2){moves++;$('#mm').textContent='Moves: '+moves;lock=true;const[a,b]=open,bs=document.querySelectorAll('.mc');
   if(deck[a]===deck[b]){bs[a].dataset.f=1;bs[b].dataset.f=1;bs[a].classList.add('on');bs[b].classList.add('on');open=[];lock=false;if(++found===8)done(Math.max(50,1400-moves*30-(Date.now()-t0)/1000*4))}
   else setTimeout(()=>{bs[a].innerHTML=ic('help','muted');bs[b].innerHTML=ic('help','muted');open=[];lock=false},700)}}}

function gTrivia(done){const qs=pick(TQ,5);let i=0,pts=0,t0=0;
 const next=()=>{if(i>=5)return done(pts);const[qq,ok,bad]=qs[i],opts=pick([ok,...bad],4);t0=Date.now();$('#ga').innerHTML=`<div class="card"><div class="mut">Question ${i+1} of 5 · ${pts} pts</div><h3>${esc(qq)}</h3><div class="grid s">${opts.map(o=>`<button class="btn sec" data-act="tg" data-a="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`};
 ACT.tg=el=>{const ok=qs[i][1],secs=(Date.now()-t0)/1000;document.querySelectorAll('[data-act=tg]').forEach(b=>{b.disabled=true;if(b.dataset.a===ok){b.style.background='var(--pri)';b.style.color='var(--priink)'}});if(el.dataset.a===ok)pts+=100+Math.max(0,Math.round(100-secs*6));else{el.style.background='var(--bad)';el.style.color='#fff'}i++;setTimeout(next,900)};next()}

function gBrain(done){const day=Math.floor(Date.now()/864e5-new Date().getTimezoneOffset()/1440),r=RID[day%RID.length],key='vbt_'+day,ans=r[1][0];let tries=0;
 if(localStorage[key]){$('#ga').innerHTML=`<div class="card empty"><div class="mut">Today's brain teaser</div><h3>${esc(r[0])}</h3><p>You already played today. The answer: <b>${esc(ans)}</b>.</p><p class="mut">Come back tomorrow for a new one!</p></div>`;return}
 $('#ga').innerHTML=`<div class="card empty"><div class="mut">Today's brain teaser · 3 attempts</div><h2>${esc(r[0])}</h2><form data-submit="bt" class="row" style="justify-content:center"><input id="bi" style="max-width:240px" autocomplete="off" placeholder="Your answer"><button class="btn">Answer</button></form><p class="mut" id="bm"></p></div>`;$('#bi').focus();
 ACT.bt=f=>{const v=f.querySelector('#bi').value.toLowerCase().replace(/[^a-z ]/g,'').replace(/^(a|an|the) /,'').trim();if(!v)return;tries++;if(r[1].includes(v)){localStorage[key]='1';done([600,400,200][tries-1])}else if(tries>=3){localStorage[key]='1';$('#ga').innerHTML=`<div class="card empty"><h3>${esc(r[0])}</h3><p>Not this time. The answer was <b>${esc(ans)}</b>.</p><p class="mut">Try again tomorrow!</p></div>`}else{$('#bm').textContent=`Not quite. ${3-tries} attempt${3-tries>1?'s':''} left.`;f.reset()}}}

function gSpin(done){const found=new Set(),cols=['#15966B','#D9A441','#14213D','#e76f51','#2a9d8f','#8e6bbf','#e9c46a','#4d96ff'];let rot=0,busy=false;
 const draw=()=>{$('#ga').innerHTML=`<div class="card empty"><p class="mut">Just for fun. There are no prizes, no money and no gambling here.</p><div style="position:relative;width:250px;margin:14px auto"><div style="position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:1.6rem;z-index:2">🔻</div><div id="wh" style="width:250px;height:250px;border-radius:50%;background:conic-gradient(${cols.map((c,i)=>`${c} ${i*45}deg ${(i+1)*45}deg`).join(',')});transition:transform 3.2s cubic-bezier(.17,.67,.1,1);transform:rotate(${rot}deg);border:5px solid var(--head)"></div></div><button class="btn" data-act="sp" ${busy?'disabled':''}>🎡 Spin</button><div id="fx" style="min-height:3.2em;margin:14px 0;font-size:1.05rem"></div><div class="mut">Discovered ${found.size}/${FACTS.length}</div>${found.size?'<button class="btn sec" style="margin-top:8px" data-act="sv">Finish &amp; save my discoveries</button>':''}</div>`};
 ACT.sp=()=>{if(busy)return;busy=true;rot+=1800+Math.floor(Math.random()*360);$('#wh').style.transform=`rotate(${rot}deg)`;$('[data-act=sp]').disabled=true;setTimeout(()=>{busy=false;const idx=Math.floor(((360-(rot%360))%360)/45);found.add(idx);const fx=FACTS[idx];draw();$('#fx').innerHTML='✨ '+esc(fx)},3400)};
 ACT.sv=()=>done(found.size*50);draw()}


/* ---------- QR codes ---------- */
const base=()=>location.href.split('#')[0];
function qrCanvas(text,px=8){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=4,c=document.createElement('canvas');c.width=c.height=(n+m*2)*px;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#14213D';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*px,(r+m)*px,px,px);return c}
function showLink(title,url){const d=document.createElement('dialog');d.innerHTML=`<h3>${esc(title)}</h3><div style="text-align:center"></div><label>Link</label><input readonly value="${esc(url)}" onfocus="this.select()"><div class="row" style="margin-top:12px"><button class="btn" data-q="copy">Copy link</button><button class="btn sec" data-q="dl">Download QR</button><button class="btn sec" data-q="share">Share</button><button class="btn sec" data-q="x">Close</button></div>`;
 const c=qrCanvas(url);c.style.cssText='width:min(260px,100%);height:auto;border-radius:12px';d.querySelector('div').append(c);
 d.onclick=async e=>{const b=e.target.closest('[data-q]');if(!b)return;const k=b.dataset.q;if(k==='x')d.close();if(k==='copy'){try{await navigator.clipboard.writeText(url);b.textContent='Copied ✓'}catch(_){d.querySelector('input').select()}}if(k==='dl'){const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='vendora-qr.png';a.click()}if(k==='share'){if(navigator.share)navigator.share({title,url}).catch(()=>{});else b.textContent='Not supported here'}};
 d.onclose=()=>d.remove();document.body.append(d);d.showModal()}

/* ---------- notifications, badges, alerts ---------- */
function setBadge(n){S.badge=n;const b=$('#nb');if(b){b.hidden=!n;b.textContent=n>9?'9+':n}if('setAppBadge' in navigator){(n?navigator.setAppBadge(n):navigator.clearAppBadge()).catch(()=>{})}document.title=(n?`(${n}) `:'')+'VENDORA – Your Market. Your Store. Your Way.'}
async function refreshBadge(){let n=0;if(S.user){const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',S.user.id).is('read_at',null);n+=count||0}
 const seen=+localStorage.vseen;if(!seen){localStorage.vseen=Date.now()}else{const iso=new Date(seen).toISOString();let ps=sb.from('products').select('id',{count:'exact',head:true}).eq('is_active',true).gt('created_at',iso),ss=sb.from('stores').select('id',{count:'exact',head:true}).eq('is_published',true).gt('created_at',iso);if(S.vendor){ps=ps.neq('vendor_id',S.vendor.id);ss=ss.neq('vendor_id',S.vendor.id)}const[{count:a},{count:b}]=await Promise.all([ps,ss]);n+=(a||0)+(b||0)}
 setBadge(n)}
function beep(){try{const c=S.ac||(S.ac=new(window.AudioContext||window.webkitAudioContext)()),t=c.currentTime;[[880,0],[1175,.15]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.15,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.start(t+d);o.stop(t+d+.3)})}catch(e){}}
function notifDest(n){const r=S.profile?.role;if(n.link)return n.link.replace(/^#/,'');if(n.orders?.reference)return r==='vendor_admin'?'/vendor?t=orders':'/track?ref='+n.orders.reference;return r==='vendor_admin'?'/vendor?t=orders':'/notifications'}
function listen(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}if(!S.user)return;S.ch=sb.channel('n-'+S.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+S.user.id},p=>onNotif(p.new)).subscribe()}
function onNotif(n){toast('🔔 '+n.title);if(navigator.vibrate)navigator.vibrate([120,60,120]);if(['vendor_admin','super_admin'].includes(S.profile?.role))beep();
 if('Notification' in window&&Notification.permission==='granted'&&document.hidden&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(n.title,{body:n.body||'',icon:'icon-192.png',badge:'icon-192.png',tag:n.id,data:{url:base()+'#'+notifDest(n)}}));
 refreshBadge();if(!document.querySelector('dialog[open]')&&/^#\/(notifications|admin|account)$|^#\/vendor(\?t=(orders|overview|reviews)(&d=\d+)?)?$/.test(location.hash))route()}

async function notifications(){const uid=S.user?.id;let al=[];
 if(uid){const{data}=await sb.from('notifications').select('*,orders:order_id(reference)').eq('user_id',uid).order('created_at',{ascending:false}).limit(60);al=data||[]}
 const seen=+localStorage.vseen||Date.now();
 const[{data:ps},{data:ns}]=await Promise.all([sb.from('products').select('id,name,price,discount_price,created_at,vendor_id').eq('is_active',true).order('created_at',{ascending:false}).limit(12),sb.from('stores').select('slug,name,logo_url,city,created_at,vendor_id').eq('is_published',true).order('created_at',{ascending:false}).limit(6)]);
 let vm={};if(ps?.length){const{data:st}=await sb.from('stores').select('vendor_id,slug,name').in('vendor_id',[...new Set(ps.map(p=>p.vendor_id))]);vm=Object.fromEntries((st||[]).map(x=>[x.vendor_id,x]))}
 const mine=v=>S.vendor&&v===S.vendor.id,isNew=x=>new Date(x.created_at).getTime()>seen&&!mine(x.vendor_id);
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone;
 const perm='Notification' in window?Notification.permission:'unsupported';
 app.innerHTML=`<h2>🔔 Notifications</h2>
 <div class="card"><div class="row sp"><div><b>Phone alerts</b><div class="mut">${perm==='granted'?'On. You will get alerts while VENDORA is open or running in the background.':perm==='denied'?'Blocked in your browser settings.':perm==='unsupported'?'Not supported in this browser.':'Get a pop-up and sound when something happens.'}</div></div>${perm==='default'?'<button class="btn sm" data-act="enable">Turn on</button>':''}${S.inst?'<button class="btn sec sm" data-act="install">⬇ Install app</button>':''}</div>${ios&&!standalone?'<p class="mut" style="margin-bottom:0">iPhone: tap the Share icon, then “Add to Home Screen” to install VENDORA and enable alerts.</p>':''}</div>
 ${uid?`<h3>Your alerts</h3>${al.length?al.map(n=>`<a class="card row sp ${n.read_at?'':'unread'}" style="color:inherit" href="#${notifDest(n)}"><span><b>${esc(n.title)}</b>${n.body?`<div class="mut">${esc(n.body)}</div>`:''}</span><span class="mut">${dt(n.created_at)}</span></a>`).join(''):'<div class="card empty">No alerts yet. Order updates, replies and platform news show up here.</div>'}`:'<div class="card empty"><a href="#/login">Log in</a> to get order and account alerts.</div>'}
 <h3>✨ What's new</h3><div class="grid">${(ns||[]).map(x=>`<a class="card" style="color:inherit;text-align:center" href="#/s/${esc(x.slug)}">${isNew(x)?'<span class="badge w">NEW STORE</span>':''}<div style="margin:6px 0"><img class="logo" ${x.logo_url?`src="${esc(x.logo_url)}"`:''} alt=""></div><b style="color:var(--head)">${esc(x.name)}</b><div class="mut">${esc(x.city||'')}</div></a>`).join('')}${(ps||[]).map(x=>{const st=vm[x.vendor_id];return `<a class="card" style="color:inherit" href="#/s/${st?esc(st.slug):''}">${isNew(x)?'<span class="badge w">NEW</span> ':''}<b style="color:var(--head)">${esc(x.name)}</b><div class="mut">${st?esc(st.name):''}</div><b>${money(x.discount_price??x.price)}</b></a>`}).join('')||''}</div>${!ns?.length&&!ps?.length?'<div class="card empty">Nothing new yet.</div>':''}`;
 localStorage.vseen=Date.now();
 if(uid&&al.some(n=>!n.read_at))await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',uid).is('read_at',null);
 refreshBadge()}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){const had=!!navigator.serviceWorker.controller;let reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloading)return;reloading=true;location.reload()});
 const offer=reg=>{if(!reg.waiting||!navigator.serviceWorker.controller||$('#upd'))return;const b=document.createElement('div');b.id='upd';b.innerHTML='<span>A new version of VENDORA is ready.</span><button class="btn sm" id="updgo">Update now</button>';document.body.append(b);$('#updgo').onclick=()=>reg.waiting.postMessage('SKIP_WAITING')};
 addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{offer(reg);reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')offer(reg)})});setInterval(()=>reg.update().catch(()=>{}),3600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{}))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.inst=e;drawNav()});
addEventListener('appinstalled',()=>{S.inst=null;drawNav();toast('VENDORA installed 🎉')});
const offBar=()=>{let b=$('#off');if(!b){b=document.createElement('div');b.id='off';b.textContent='You are offline. Orders and payments need a connection.';document.body.prepend(b)}b.hidden=navigator.onLine};
addEventListener('online',()=>{offBar();route()});addEventListener('offline',offBar);offBar();

/* ---------- boot ---------- */
loadSession().then(route);
if(location.hash.includes('type=recovery')||location.hash.includes('access_token')){location.hash='#/account'}
</script></body></html>
